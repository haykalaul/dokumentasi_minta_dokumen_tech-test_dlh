name: Laravel CI with Gemini AI Code Quality Check

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: app_testing
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 2 # Fetch depth 2 to allow git diff HEAD~1 HEAD to work

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, xml, ctype, iconv, mysql, pgsql, pdo_pgsql, zip
        coverage: none

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Copy Environment Config
      run: php -r "file_exists('.env') || copy('.env.example', '.env');"

    - name: Configure .env for Testing
      run: |
        sed -i 's/DB_CONNECTION=sqlite/DB_CONNECTION=sqlite/g' .env
        sed -i 's/DB_DATABASE=laravel/DB_DATABASE=:memory:/g' .env

    - name: Install Composer Dependencies
      run: composer install --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

    - name: Install NPM Dependencies
      run: npm install --legacy-peer-deps

    - name: Run Coding Style Check (Laravel Pint)
      run: ./vendor/bin/pint --test

    - name: Compile Frontend Assets
      run: npm run build

    - name: Generate Application Key
      run: php artisan key:generate

    - name: Run PHPUnit Feature & Unit Tests
      run: php artisan test

    - name: Gemini AI Code Review Collaborator
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: node scripts/gemini-reviewer.js
